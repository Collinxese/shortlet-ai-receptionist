name: Security remediation tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-remediation-tests.yml"
      - "prisma/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-test-suite:
    name: Unit and integration tests (ephemeral PostgreSQL only)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/credential-safe-test-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shortlet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shortlet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Deliberately nonexistent guard URL. The application DB is never provisioned
      # or contacted by this workflow. Integration tests must use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_guard?schema=public
      # Disposable PostgreSQL service created for this job and destroyed afterwards.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shortlet_test?schema=public
      AI_PROVIDER: mock
      PAYSTACK_TEST_ENABLED: "false"
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit and health tests
        run: npm test
      - name: Run integration and migration tests against disposable PostgreSQL
        run: npm run test:integration
